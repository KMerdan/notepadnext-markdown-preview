name: Marketplace checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm run ci
      - name: Verify all release packages
        run: |
          node plugins/markdown-preview/node_modules/@notepadnext/plugin-sdk/release.cjs plugins/markdown-preview "$RUNNER_TEMP/markdown-assets"
          node plugins/html-preview/node_modules/@notepadnext/plugin-sdk/release.cjs plugins/html-preview "$RUNNER_TEMP/html-assets"
          node examples/text-inspector/node_modules/@notepadnext/plugin-sdk/release.cjs examples/text-inspector "$RUNNER_TEMP/inspector-assets"
          node examples/todo-navigator/node_modules/@notepadnext/plugin-sdk/release.cjs examples/todo-navigator "$RUNNER_TEMP/todo-assets"
