name: Build plugin release
on:
  push:
    tags: ['kmerdan.*/v*']
permissions:
  contents: write
concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Build, test and package the selected plugin
        env:
          PLUGIN_RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/marketplace.cjs release "$PLUGIN_RELEASE_TAG" "$RUNNER_TEMP/plugin-release"
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$PLUGIN_RELEASE_TAG"
          "$RUNNER_TEMP/plugin-release/notepadnext-plugin.zip"
          "$RUNNER_TEMP/plugin-release/notepadnext-plugin-checksums.json"
          --verify-tag --draft --title "$PLUGIN_RELEASE_TAG" --generate-notes
